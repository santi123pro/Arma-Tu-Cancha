<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Modo día u oscuro antes de pintar: la elección guardada o, si no hay, la del sistema. -->
    <script>
      try {
        var tema = localStorage.getItem('atc-tema')
        if (tema !== 'claro' && tema !== 'oscuro') {
          tema = matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro'
        }
        document.documentElement.dataset.tema = tema
      } catch (e) {
        document.documentElement.dataset.tema = 'claro'
      }
    </script>
